name: Import machine exam PDFs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-machine-pdfs-once.yml'

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original machine safety PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/machine/pdf
          curl -fL --retry 3 --retry-delay 2 'https://www.exam.or.jp/CS_r041/CS20221903.pdf' -o assets/machine/pdf/r04-machine.pdf
          curl -fL --retry 3 --retry-delay 2 'https://www.exam.or.jp/CS_r051/CS20231903.pdf' -o assets/machine/pdf/r05-machine.pdf
          curl -fL --retry 3 --retry-delay 2 'https://www.exam.or.jp/wp-content/uploads/2024/12/CS20241903.pdf' -o assets/machine/pdf/r06-machine.pdf
          curl -fL --retry 3 --retry-delay 2 'https://www.exam.or.jp/wp-content/uploads/2025/11/CS20251903.pdf' -o assets/machine/pdf/r07-machine.pdf

      - name: Validate downloaded PDFs
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/machine/pdf/*.pdf; do
            echo "Checking $f"
            test "$(head -c 5 "$f")" = '%PDF-'
            test "$(stat -c %s "$f")" -gt 100000
          done
          ls -lh assets/machine/pdf/*.pdf

      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/machine/pdf/*.pdf
          if git diff --cached --quiet; then
            echo 'PDFs already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'Import original machine safety exam PDFs'
          git push origin HEAD:main
