name: Install exact R05/R06 supplied PNGs

on:
  push:
    branches:
      - fix/r05-r06-exact-originals

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r05-r06-exact-originals
          fetch-depth: 0

      - name: Verify supplied ZIP and exact PNGs
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile

          zip_path = Path('r56-current-exact.zip')
          expected_zip = '8cff328004ed91f6bb837e40f7525b4e5ad4542f1a19be9dcadad3c298f994a4'
          actual_zip = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('ZIP SHA-256:', actual_zip)
          if actual_zip != expected_zip:
              raise SystemExit(f'ZIP SHA mismatch: {actual_zip}')

          expected = {
            'r05-q2.png': 'c4ebc22b1604af79f1a119fde6fbb15e526ef20bd8ff23d881e22ba0ba963139',
            'r05-q3.png': 'fb1b4e2ed06315194d10aabd046107d7e8cc2214327f61b96ea192efbb490554',
            'r05-q3-1.png': '6842f8f102df7a42877a7269abf75c230aca768cf900c41d1d9e4ef10cc9cdcb',
            'r05-q3-2.png': 'a889668758fd1c90e5335abca2f414865c256943e602815ffd9ad357387703a6',
            'r05-q3-3.png': '0ec3d4ddc978b12576bec8cc2597277d1c9653b2d2ec2136cf2d549136082c83',
            'r05-q4.png': '0c3f2e2d672469868fc90b405cf9711dc524abeff18c6d24da8ea5b7990342b1',
            'r05-q4-1.png': 'c8f871886291fc9312ed338abc515b91bb03240b91ea20dff75061292265088d',
            'r06-q1.png': 'e8941f30ed7035652b2103ea2c8c32e362cc8992ec6b4e3bebe5dd3c9bd8be1d',
            'r06-q2.png': 'd8c718df8b7853e6e2aab62607e2b122a6d013cb7d69db530a8a2ffbfe1fddec',
            'r06-q3.png': '18f003186186b2a946c9b8b74a39c02428b87459cdb6443c6ae1c2bfef2950cd',
            'r06-q3-1.png': '73d5bd498ad77a7c2e1abea3e7b8437e9b195c39e8eea636d759c0845912def1',
            'r06-q3-2.png': '9146ccd151965c15bb80774a39a559b0bc750babe1c5889778a29aec7017499e',
            'r06-q4.png': 'dead787516df6d09e59987bd074d10bd017e4fde2be22ecfccda57b328ccb3e5',
            'r06-q4-1.png': '45edf498b59e80a6a33ff4319342d5110120547e0840d0ce1db6046f2749af50',
          }

          out = Path('/tmp/r56-exact')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              names = set(z.namelist())
              if set(expected) != names:
                  raise SystemExit(f'Unexpected ZIP files: {sorted(names)}')
              z.extractall(out)

          target = Path('assets/machine/figures')
          for name, sha in expected.items():
              data = (out / name).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != sha:
                  raise SystemExit(f'{name}: SHA mismatch {actual}')
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'{name}: invalid PNG header')
              (target / name).write_bytes(data)
              print(name, len(data), actual)

      - name: Verify exact Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [r05-q2.png]=9ed09ff3413666440f312e36e19387ba049d3363
            [r05-q3.png]=320e5d7f69df6e93d8dd50af5cfe42c8900cab4c
            [r05-q3-1.png]=4b869ca15e0e62c503c930ee86147ad6f93c2c0a
            [r05-q3-2.png]=1cd61536817709210619036125e178902498dd87
            [r05-q3-3.png]=260328141a42db5865c9e31cbb209854953c39d5
            [r05-q4.png]=6df767574c9418d5f4a5b13542d388b4cf6e34ec
            [r05-q4-1.png]=e7f07e5211611357008fa725f80ff7c19b7bbfd3
            [r06-q1.png]=14a8736b9aebb88b4bea4c938c7e7505a9850623
            [r06-q2.png]=07dfaaead74530f7583bb2713788682312e484bd
            [r06-q3.png]=c3dd5c37dd57df5b52db082fc50e1cb3ecd73e2f
            [r06-q3-1.png]=f225869b792e163a9746b7087900827a31a1ddb2
            [r06-q3-2.png]=4a5e85f51aa3c1ed1000f69dcc506d8f165a7386
            [r06-q4.png]=db7ac52886ec26193747f8f2e37be89e44e04eaa
            [r06-q4-1.png]=5f6f679bf1293d727c7e1b12a372bd3817068629
          )
          for f in "${!expected[@]}"; do
            actual=$(git hash-object "assets/machine/figures/$f")
            test "$actual" = "${expected[$f]}" || { echo "$f git SHA mismatch: $actual"; exit 1; }
            echo "$f $actual"
          done

      - name: Refresh manifest version and PWA cache
        shell: python
        run: |
          from pathlib import Path
          import json, re
          p = Path('assets/machine/figures/manifest.json')
          m = json.loads(p.read_text())
          m['version'] = '2026-08-21-r05-r07-exact-1'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')

          sw = Path('sw.js')
          s = sw.read_text()
          match = re.search(r'rouan-dojo-static-v(\d+)', s)
          if not match:
              raise SystemExit('PWA cache version not found')
          n = int(match.group(1)) + 1
          s = s.replace(match.group(0), f'rouan-dojo-static-v{n}', 1)
          sw.write_text(s)
          print('PWA cache ->', n)

      - name: Remove one-time installer inputs
        run: |
          rm -f r56-current-exact.zip
          rm -f .github/workflows/install-r05-r06-exact-originals.yml

      - name: Commit exact supplied PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Replace R05/R06 figures with exact supplied PNGs'
          git push origin HEAD:fix/r05-r06-exact-originals
